workflows:
  android-buildozer:
    name: DursunVenture APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install dependencies
        script: |
          pip3 install --upgrade buildozer cython virtualenv

      - name: Install system packages
        script: |
          brew install autoconf automake libtool pkg-config

      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          buildozer android debug 2>&1

    artifacts:
      - bin/*.apk

    publishing:
      email:
        recipients:
          - talhaderyavahap@gmail.com
        notify:
          success: true
          failure: true
