workflows:
  android-buildozer:
    name: DursunVenture APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install Python dependencies
        script: |
          pip3 install --upgrade buildozer cython virtualenv

      - name: Install system packages
        script: |
          brew install autoconf automake libtool pkg-config

      - name: Setup Android SDK
        script: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK
        script: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          cd $CM_BUILD_DIR
          buildozer android debug 2>&1

    artifacts:
      - bin/*.apk

    publishing:
      email:
        recipients:
          - talhaderyavahap@gmail.com
        notify:
          success: true
          failure: true
