name: DursunVenture Android APK Build
# Repo: https://github.com/codetabsite/Dursun-Talr

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

    - name: Repo'yu al
      uses: actions/checkout@v4

    - name: Python 3.10 kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Sistem paketlerini kur
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential git zip unzip \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libffi-dev libssl-dev zlib1g-dev libjpeg-dev libpng-dev \
          autoconf libtool pkg-config ccache

    - name: pip bağımlılıklarını kur
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.36 pygame==2.5.2

    - name: Android SDK/NDK cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer/android/platform/android-sdk
          ~/.buildozer/android/platform/android-ndk
        key: android-sdk-ndk-${{ runner.os }}-v4
        restore-keys: android-sdk-ndk-${{ runner.os }}-

    - name: Buildozer cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v3
        restore-keys: buildozer-${{ runner.os }}-

    - name: Sprite ve ses dosyalarını üret
      run: |
        export SDL_VIDEODRIVER=dummy
        export SDL_AUDIODRIVER=dummy
        python3 sprite_gen.py
        cd assets/sounds && python3 gen_sounds.py && cd ../..
        python3 mapgen.py

    - name: Android SDK lisanslarını kabul et
      run: |
        ANDROID_SDK=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_SDK/licenses
        printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" \
          > $ANDROID_SDK/licenses/android-sdk-license
        printf "84831b9409646a918e30573bab4c9c91346d8abd" \
          > $ANDROID_SDK/licenses/android-sdk-preview-license
        printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" \
          > $ANDROID_SDK/licenses/google-gdk-license

    - name: APK build (debug)
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        yes | buildozer -v android debug 2>&1 | tee build_log.txt || true
        echo "--- APK arama ---"
        find . -name "*.apk" 2>/dev/null || echo "APK bulunamadi"

    - name: APK artifact kaydet
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: DursunVenture-debug-apk
        path: |
          bin/*.apk
          build_log.txt
        retention-days: 30
        if-no-files-found: warn
