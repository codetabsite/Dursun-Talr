name: DursunVenture Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Python 3.10 kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Java 11 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Sistem paketleri
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential git zip unzip \
          libffi-dev libssl-dev zlib1g-dev \
          libjpeg-dev libpng-dev autoconf libtool \
          pkg-config ccache libltdl-dev

    - name: pip kur
      run: |
        pip install --upgrade pip
        pip install \
          buildozer==1.5.0 \
          cython==0.29.36

    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-v5-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-v5-${{ runner.os }}-

    - name: Sprite ve ses üret
      run: |
        pip install pygame
        export SDL_VIDEODRIVER=dummy
        export SDL_AUDIODRIVER=dummy
        python3 sprite_gen.py
        cd assets/sounds && python3 gen_sounds.py && cd ../..
        python3 mapgen.py

    - name: Android lisansları kabul et
      run: |
        SDK=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $SDK/licenses
        printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > $SDK/licenses/android-sdk-license
        printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > $SDK/licenses/android-sdk-preview-license

    - name: APK build
      run: |
        export JAVA_HOME=$JAVA_HOME_11_X64
        yes | buildozer -v android debug 2>&1 | tee build_log.txt || true
        find . -name "*.apk" 2>/dev/null | tee found_apks.txt
        cat found_apks.txt

    - name: APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: DursunVenture-APK
        path: |
          bin/*.apk
          build_log.txt
          found_apks.txt
        retention-days: 30
        if-no-files-found: warn
